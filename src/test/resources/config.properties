# Project W API Test Configuration
# -----------------------------------------------------------------------------
# Base URL of the Project_W_BE API server
# Default: dev API. Override with -Dbase.url=... or -Pdev for https://dev.ekohamgroup.com
base.url=https://dev.api.ekohamgroup.com

# API base path (all endpoints are prefixed with this)
api.base.path=/accounts/api

# --- Test Credentials --------------------------------------------------------
# These credentials must exist in the database before running tests.
# Run scripts/create-default-roles.js in Project_W_BE first.
test.eid=ekoham

# Admin user (role.hierarchy >= 80) — used for all admin-only operations
test.admin.email=ganesh@gmail.com
test.admin.password=Jio@12345
# MongoDB ObjectId of the admin user — used by admin-create attendance tests.
# Populate by logging in as admin and reading data._id from the login response.
test.admin.user_id=

# Employee user (regular role) — used for employee-perspective attendance tests
# (check-in, check-out, break, regularization submit, today summary, history)
test.employee.email=prathik@gmail.com
test.employee.password=Jio@12345

# --- Timeouts ----------------------------------------------------------------
connection.timeout=10000
read.timeout=15000

# --- Allure ------------------------------------------------------------------
allure.results.directory=target/allure-results
