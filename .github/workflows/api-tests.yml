# Project W API Test Suite — GitHub Actions
# Runs full TestNG suite on push/PR to main; publishes test results.
# Set repository secrets: TEST_ADMIN_PASSWORD, TEST_EMPLOYEE_PASSWORD (optional: BASE_URL). See CI.md.

name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run API tests
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://dev.api.ekohamgroup.com' }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_EMPLOYEE_PASSWORD: ${{ secrets.TEST_EMPLOYEE_PASSWORD }}
        run: |
          OPTS="-Dbase.url=$BASE_URL"
          [ -n "$TEST_ADMIN_PASSWORD" ] && OPTS="$OPTS -Dtest.admin.password=$TEST_ADMIN_PASSWORD"
          [ -n "$TEST_EMPLOYEE_PASSWORD" ] && OPTS="$OPTS -Dtest.employee.password=$TEST_EMPLOYEE_PASSWORD"
          mvn clean test -Psuite -B -q $OPTS

      - name: Publish TestNG / Surefire results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/**/*.xml
          check_name: API Test Results

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: ignore
